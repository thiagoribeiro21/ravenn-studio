<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── SEO Primário — LP dedicada de Landing Pages de Alta Conversão (tráfego pago) ── -->
  <title>Criação de Landing Pages para Google Ads em Niterói, RJ | Ravenn Studio</title>
  <meta name="description" content="Landing pages de alta conversão para Google Ads: copywriting orientado a venda, design exclusivo sem templates e rastreamento configurado do zero. Entrega em 7 dias úteis." />
  <meta name="keywords" content="criação de landing page, landing page para google ads, landing page de alta conversão, criar landing page profissional, agência de landing page, landing page que converte" />
  <link rel="canonical" href="https://ravennstudio.com.br/landing-pages" />

  <!-- ── Robots — noindex: esta URL é destino de campanhas pagas (Google Ads), o conteúdo indexável/compartilhável equivalente vive em /solucoes/ (mesmas seções, header/footer da home) — evita a mesma página competindo consigo mesma no índice orgânico. "follow" mantido: os links internos daqui continuam repassando autoridade normalmente. ── -->
  <meta name="robots" content="noindex, follow" />
  <meta name="author" content="Ravenn Studio" />

  <!-- ── Geo / Local SEO ──────────────────────────────────────────────────── -->
  <meta name="geo.region" content="BR-RJ" />
  <meta name="geo.placename" content="Niterói, Rio de Janeiro, Brasil" />
  <meta name="geo.position" content="-22.8838;-43.1044" />
  <meta name="ICBM" content="-22.8838, -43.1044" />

  <!-- ── Open Graph ────────────────────────────────────────────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ravennstudio.com.br/landing-pages" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Ravenn Studio" />
  <meta property="og:title" content="Criação de Landing Pages para Google Ads em Niterói, RJ" />
  <meta property="og:description" content="Landing pages de alta conversão para quem investe em tráfego pago. Copywriting, design exclusivo e rastreamento configurado do zero. Entrega em 7 dias úteis." />
  <meta property="og:image" content="https://ravennstudio.com.br/og-image.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Ravenn Studio — Landing Pages de Alta Conversão" />

  <!-- ── Twitter / X Card ─────────────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Criação de Landing Pages para Google Ads em Niterói, RJ" />
  <meta name="twitter:description" content="Landing pages de alta conversão para quem investe em tráfego pago. Entrega em 7 dias úteis." />
  <meta name="twitter:image" content="https://ravennstudio.com.br/og-image.webp" />

  <!-- ── Theme ─────────────────────────────────────────────────────────────── -->
  <meta name="theme-color" content="#000000" />

  <!-- ── Structured Data: Service ──────────────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "serviceType": "Criação de Landing Pages para Google Ads",
    "provider": {
      "@id": "https://ravennstudio.com.br/#business"
    },
    "areaServed": [
      { "@type": "City", "name": "Niterói" },
      { "@type": "State", "name": "Rio de Janeiro" }
    ],
    "description": "Landing pages de alta conversão para campanhas de Google Ads: copywriting de resposta direta, design exclusivo sem templates e rastreamento (GA4/UTM) configurado do zero."
  }
  </script>

  <!-- ── Structured Data: FAQPage — mesmas perguntas/respostas da seção
       "Perguntas diretas" (FaqPanel.jsx + config/landing-pages.js `faq`).
       Alvo: featured snippets e citação direta por IA generativa. ────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Quanto custa uma landing page de alta conversão?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cada projeto é orçado pelo escopo: número de seções, integrações e prazo. O diagnóstico gratuito define o escopo antes de qualquer proposta."
        }
      },
      {
        "@type": "Question",
        "name": "Em quanto tempo a página fica pronta?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "7 dias úteis entre o briefing e o lançamento, com 2 rodadas de revisão inclusas. Prazos maiores só em escopos fora do padrão."
        }
      },
      {
        "@type": "Question",
        "name": "Vocês cuidam da gestão dos anúncios também?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A landing page é o foco deste serviço, mas também oferecemos gestão de Google Ads à parte, caso você precise das duas pontas."
        }
      },
      {
        "@type": "Question",
        "name": "A página já vem com rastreamento configurado?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sim, GA4 e UTMs configurados do zero antes do lançamento, pra você medir cada conversão desde o primeiro clique."
        }
      }
    ]
  }
  </script>

  <!-- ── Structured Data: WebPage + Speakable ─────────────────────────────
       `speakable` aponta pros parágrafos BLUF da página (classe `rv-bluf`,
       ver BentoValue.jsx/ConceptStack.jsx) — a resposta direta de 40-60
       palavras logo abaixo de cada H2 informacional, pensada pra ser lida
       isolada por um assistente de voz ou citada por um RAG sem precisar
       do resto da página em volta. ───────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "url": "https://ravennstudio.com.br/landing-pages",
    "name": "Criação de Landing Pages para Google Ads em Niterói, RJ",
    "speakable": {
      "@type": "SpeakableSpecification",
      "cssSelector": [".rv-bluf"]
    }
  }
  </script>

  <!-- ── LCP hero image ────────────────────────────────────────────────────
       Preload direto no <head>: mesma razão de sites-institucionais.html —
       a página é CSR, então o preload scanner não descobre a imagem do
       hero sozinho (ela só existe depois do bundle JS rodar). Os paths
       abaixo têm que espelhar `hero.deviceImages` em
       config/landing-pages.js — hoje reaproveitando o mesmo mockup de
       sites-institucionais.html (pedido explícito do usuário). ───────── -->
  <link rel="preload" as="image" href="/lp-institucional/hero-device-mobile.webp" media="(max-width: 767px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/lp-institucional/hero-device.webp" media="(min-width: 768px)" fetchpriority="high" />

  <!-- ── Fonts ─────────────────────────────────────────────────────────────── -->
  <style>html,body{background:#000000;margin:0;padding:0;}</style>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&f[]=satoshi@300,400,500,700&display=optional" />
  <link
    href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&f[]=satoshi@300,400,500,700&display=optional"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&f[]=satoshi@300,400,500,700&display=optional" rel="stylesheet" />
  </noscript>
  <script defer src="/error-beacon.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/lp-landing-pages.jsx"></script>
</body>
</html>
