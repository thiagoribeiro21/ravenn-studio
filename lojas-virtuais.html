<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── SEO Primário — LP dedicada de Lojas Virtuais de Alta Performance (tráfego pago) ── -->
  <title>Criação de Lojas Virtuais em Niterói, RJ | Ravenn Studio</title>
  <meta name="description" content="Lojas virtuais mobile-first com checkout em 3 etapas, Pix integrado e PageSpeed 90+. Design exclusivo, sem tema genérico de plataforma. Diagnóstico gratuito." />
  <meta name="keywords" content="criação de loja virtual, desenvolvimento de e-commerce, criar loja online, e-commerce profissional, loja virtual mobile, checkout otimizado" />
  <link rel="canonical" href="https://ravennstudio.com.br/lojas-virtuais" />

  <!-- ── Robots — noindex: esta URL é destino de campanhas pagas (Google Ads), o conteúdo indexável/compartilhável equivalente vive em /solucoes/ (mesmas seções, header/footer da home) — evita a mesma página competindo consigo mesma no índice orgânico. "follow" mantido: os links internos daqui continuam repassando autoridade normalmente. ── -->
  <meta name="robots" content="noindex, follow" />
  <meta name="author" content="Ravenn Studio" />

  <!-- ── Geo / Local SEO ──────────────────────────────────────────────────── -->
  <meta name="geo.region" content="BR-RJ" />
  <meta name="geo.placename" content="Niterói, Rio de Janeiro, Brasil" />
  <meta name="geo.position" content="-22.8838;-43.1044" />
  <meta name="ICBM" content="-22.8838, -43.1044" />

  <!-- ── Open Graph ────────────────────────────────────────────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ravennstudio.com.br/lojas-virtuais" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Ravenn Studio" />
  <meta property="og:title" content="Criação de Lojas Virtuais em Niterói, RJ" />
  <meta property="og:description" content="Lojas virtuais mobile-first com checkout otimizado e PageSpeed 90+. Diagnóstico gratuito." />
  <meta property="og:image" content="https://ravennstudio.com.br/og-image.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Ravenn Studio — Lojas Virtuais de Alta Performance" />

  <!-- ── Twitter / X Card ─────────────────────────────────────────────────── -->

  <meta name="twitter:title" content="Criação de Lojas Virtuais em Niterói, RJ" />
  <meta name="twitter:description" content="Lojas virtuais mobile-first com checkout otimizado. Diagnóstico gratuito." />
  <meta name="twitter:image" content="https://ravennstudio.com.br/og-image.webp" />

  <!-- ── Theme ─────────────────────────────────────────────────────────────── -->
  <meta name="theme-color" content="#000000" />

  <!-- ── Structured Data: Service ──────────────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "serviceType": "Criação de Lojas Virtuais",
    "provider": {
      "@type": "LocalBusiness",
      "name": "Ravenn Studio",
      "telephone": "+55-21-98921-1887",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Niterói",
        "addressRegion": "RJ",
        "addressCountry": "BR"
      }
    },
    "areaServed": [
      { "@type": "City", "name": "Niterói" },
      { "@type": "State", "name": "Rio de Janeiro" }
    ],
    "description": "Desenvolvimento de lojas virtuais mobile-first, com checkout otimizado em 3 etapas, integração de pagamento (Pix, cartão, boleto) e PageSpeed 90+."
  }
  </script>

  <!-- ── LCP hero image ────────────────────────────────────────────────────
       Preload direto no <head>: a página é CSR, então o preload scanner
       não descobre a imagem do hero sozinho. Reaproveita o mesmo mockup
       de sites-institucionais.html (pedido explícito do usuário). ────── -->

  <link rel="preload" as="image" href="/lp-institucional/hero-device.webp" media="(min-width: 768px)" fetchpriority="high" />
